# Uploads a Python package to PyPI with Twine when a GitHub release is created.
# See https://docs.github.com/en/actions/use-cases-and-examples/publishing-packages/publishing-python-packages

name: Upload Python Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Check the package installs
      run: pip install -e .
    - name: Build
      # `python -m build` rather than `setup.py sdist bdist_wheel`: invoking setup.py
      # directly is deprecated and warns on current setuptools.
      run: python -m build
    - name: Check metadata before uploading
      # Catches a malformed long_description, which PyPI otherwise rejects only after the
      # upload has started -- and a version number can never be reused.
      run: twine check dist/*
    - name: Publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: twine upload --non-interactive dist/*
